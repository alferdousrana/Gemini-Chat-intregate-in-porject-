<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat with Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 28px;
            font-weight: 600;
        }
        
        .chat-header p {
            margin-top: 5px;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .chat-body {
            padding: 30px;
        }
        
        .chat-messages {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message strong {
            display: block;
            margin-bottom: 5px;
            color: #667eea;
        }
        
        .message.user strong {
            color: #764ba2;
        }
        
        .message-content {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        /* Markdown-style formatting */
        .message-content .bold {
            font-weight: bold;
            color: #764ba2;
        }
        
        .message-content .italic {
            font-style: italic;
        }
        
        .message-content .list-item {
            margin-left: 20px;
            margin-bottom: 5px;
        }
        
        /* Formatting for AI responses */
        .message-content h1,
        .message-content h2,
        .message-content h3 {
            color: #667eea;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        
        .message-content h1 {
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .message-content h2 {
            font-size: 18px;
        }
        
        .message-content h3 {
            font-size: 16px;
        }
        
        .message-content p {
            margin-bottom: 10px;
        }
        
        .message-content ul,
        .message-content ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        
        .message-content li {
            margin-bottom: 5px;
        }
        
        .message-content strong {
            color: #764ba2;
            display: inline;
            margin: 0;
        }
        
        .message-content em {
            font-style: italic;
            color: #555;
        }
        
        .message-content code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .message-content pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 10px;
        }
        
        .message-content pre code {
            background: none;
            padding: 0;
        }
        
        .message-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 15px;
            margin: 10px 0;
            color: #555;
            font-style: italic;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        #user_message {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        #user_message:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #dc3545;
        }
        
        .loading {
            color: #6c757d;
            font-style: italic;
            padding: 12px;
            text-align: center;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Chat Assistant</h1>
            <p>Powered by Google Gemini</p>
        </div>
        
        <div class="chat-body">
            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    <p>Start a conversation by typing a message below</p>
                </div>
            </div>
            
            <div class="input-group">
                <input type="text" id="user_message" placeholder="Ask me anything..." />
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById("user_message");
        const chatMessages = document.getElementById("chat-messages");
        const sendBtn = document.getElementById("sendBtn");

        // Allow Enter key to send message
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = inputField.value.trim();
            
            if (!message) {
                showError("Please enter a message.");
                return;
            }

            // Clear empty state
            if (chatMessages.querySelector('.empty-state')) {
                chatMessages.innerHTML = '';
            }

            // Add user message
            addMessage(message, 'user');

            // Disable input while processing
            sendBtn.disabled = true;
            inputField.disabled = true;
            inputField.value = '';

            // Show loading
            const loadingId = addLoadingMessage();

            // URL encode the message
            const encodedMessage = encodeURIComponent(message);
            const url = `/ai/chat/?message=${encodedMessage}`;
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Network response was not ok');
                    });
                }
                return response.json();
            })
            .then(data => {
                // Remove loading message
                removeLoadingMessage(loadingId);
                
                if (data.response) {
                    addMessage(data.response, 'ai');
                } else {
                    showError(data.error || 'Unknown error');
                }
            })
            .catch(error => {
                // Remove loading message
                removeLoadingMessage(loadingId);
                showError(error.message);
            })
            .finally(() => {
                // Re-enable input
                sendBtn.disabled = false;
                inputField.disabled = false;
                inputField.focus();
            });
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = type === 'user' ? 'You' : 'AI';
            
            // Format content for AI responses
            let formattedContent;
            if (type === 'ai') {
                formattedContent = formatAIResponse(text);
            } else {
                formattedContent = escapeHtml(text);
            }
            
            messageDiv.innerHTML = `
                <strong>${label}:</strong>
                <div class="message-content">${formattedContent}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatAIResponse(text) {
            // Escape HTML first
            text = escapeHtml(text);
            
            // Convert **bold** to <strong>
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong class="bold">$1</strong>');
            
            // Convert *italic* to <em>
            text = text.replace(/\*(.+?)\*/g, '<em class="italic">$1</em>');
            
            // Convert bullet points (*, -, •) to proper list items
            text = text.replace(/^[\*\-•]\s+(.+)$/gm, '<div class="list-item">• $1</div>');
            
            // Convert numbered lists (1., 2., etc.) to proper list items
            text = text.replace(/^\d+\.\s+(.+)$/gm, '<div class="list-item">$1</div>');
            
            // Convert line breaks to <br>
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }

        function addLoadingMessage() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-message';
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = '🤔 Thinking...';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return 'loading-message';
        }

        function removeLoadingMessage(id) {
            const loadingDiv = document.getElementById(id);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = `<strong>Error:</strong> ${escapeHtml(message)}`;
            chatMessages.appendChild(errorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
